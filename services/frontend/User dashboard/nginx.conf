server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: 이 앱은 라우팅을 URL 경로가 아니라 React state로 하지만,
    # 구글 로그인 콜백처럼 브라우저가 직접 이동하는 경로(/oauth/callback 등)는
    # 실제 파일이 없으니 nginx 기본 설정으로는 404가 난다. 항상 index.html을
    # 내려주고 그 안의 React가 쿼리스트링(?token=...)을 읽게 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
